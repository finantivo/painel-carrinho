<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel Carrinho de Festas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317201D'/%3E%3Crect x='8' y='17' width='4' height='7' rx='1' fill='%238DB3A6'/%3E%3Crect x='14' y='12' width='4' height='12' rx='1' fill='%238DB3A6'/%3E%3Crect x='20' y='8' width='4' height='16' rx='1' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  /* Moldura: mostra o painel (Google Apps Script) em tela cheia, sem dados próprios. */
  html, body { margin: 0; height: 100%; background: #F4F5F3; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .ajuda { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); font: 13px/1.4 system-ui, sans-serif;
    background: #17201D; color: #E8EEEB; padding: 8px 14px; border-radius: 999px; text-decoration: none; opacity: 0; transition: opacity .3s; }
  .ajuda.mostrar { opacity: .92; }
</style>
</head>
<body>
<iframe id="painel" title="Painel Carrinho de Festas"
  src="https://script.google.com/macros/s/AKfycbz0wf50aEogBDm_VAzxX5KhCOQcksikcw192OoyozWiMkESIxgI0NC78nY2cQd8mR2ArA/exec"
  allow="clipboard-write"></iframe>
<!-- Se o navegador não deixar o Google funcionar dentro da moldura (janela anônima, iPhone, sem login),
     o painel não manda o aviso "ok" e a moldura abre o painel direto. -->
<a class="ajuda" id="ajuda" target="_top" href="">O painel não carregou? Abrir direto ›</a>
<script>
  var DIRETO = document.getElementById('painel').src;
  var ok = false;
  document.getElementById('ajuda').href = DIRETO;
  window.addEventListener('message', function (e) {
    if (e.data === 'painel-carrinho-ok' && /(^|\.)googleusercontent\.com$|(^|\.)google\.com$/.test(new URL(e.origin).hostname)) ok = true;
  });
  setTimeout(function () { if (!ok) location.replace(DIRETO); }, 9000);
  setTimeout(function () { if (!ok) document.getElementById('ajuda').classList.add('mostrar'); }, 25000);
</script>
</body>
</html>
